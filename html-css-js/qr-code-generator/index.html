<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>
<link rel="stylesheet" href="index.css">

</head>
<body>
    <div class="container">

    <h1>QR Code Generator</h1>

    <div class="input-group">
        <label>Enter Text or URL</label>
        <input type="text" id="text" placeholder="https://example.com">
    </div>

    <div class="input-group">
        <label>QR Size</label>
        <select id="size">
        <option value="150">150x150</option>
        <option value="200" selected>200x200</option>
        <option value="250">250x250</option>
        <option value="300">300x300</option>
        </select>
    </div>

    <div class="input-group">
        <label>Colors</label>
        <div class="color-group">
            <input type="color" id="darkColor" value="#000000">
            <input type="color" id="lightColor" value="#ffffff">
        </div>
    </div>

    <button class="generate" onclick="generateQR()">Generate QR Code</button>

    <div id="qrcode"></div>
    
        <button class="download" onclick="downloadQR()">Download QR</button>

        <button class="clear" onclick="clearQR()">Clear</button>

    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="index.js"></script>

</body>
</html>
