<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Strength Checker</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="card">

    <h1>Password strength checker</h1>
    <p class="subtitle">Type a password to test how strong it is</p>

    <!-- INPUT FIELD + SHOW/HIDE TOGGLE -->
    <div class="input-wrapper">
      <input type="password" id="passwordInput" placeholder="Enter a password..." oninput="checkPassword(this.value)" />
      <button class="toggle-btn" onclick="toggleVisibility()" aria-label="Toggle password visibility">
        👁
      </button>

    </div>

    <!-- STRENGTH BAR — 4 coloured segments -->
    <div class="strength-bar">
      <div class="segment" id="seg1"></div>
      <div class="segment" id="seg2"></div>
      <div class="segment" id="seg3"></div>
      <div class="segment" id="seg4"></div>
    </div>

    <!-- LABEL + SCORE -->
    <div class="strength-info">
      <span id="strengthLabel">Enter a password to begin</span>
      <span id="scoreDisplay"></span>
    </div>

    <hr class="divider" />

    <!-- CRITERIA CHECKLIST -->
    <p class="criteria-title">Criteria</p>
    <div class="criteria-list" id="criteriaList">
      <!-- Items are generated by renderCriteria() below -->
    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
